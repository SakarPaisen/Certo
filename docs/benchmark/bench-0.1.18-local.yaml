# baseline-0.1.18-local.md (Certo 0.1.18, 2026-10-19): is qwen3-coder:30b,
# the old `certo init` default, as good as qwen3.8:27b? Both on Ollama,
# each alone, in one run.
# Run it with: certo bench --config bench-0.1.18-local.yaml
# Both models must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md. Expect about 7 hours.
tasks: all
repeats: 3
arms:
  - {name: qwen3-coder, strategy: single, model: qwen3-coder-local}
  - {name: qwen3.8,     strategy: single, model: qwen3.8-27b-local}
