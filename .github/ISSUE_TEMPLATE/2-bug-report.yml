name: Bug report
description: Certo crashed, printed an error, or did something it shouldn't.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [Troubleshooting](https://github.com/alessioricco/certo/blob/main/docs/troubleshooting.md)
        first: it has the problems people hit most, with their fix.
        **Remove API keys and anything private from the output before you post.**
  - type: input
    id: version
    attributes:
      label: Certo version
      description: The output of `certo --version`.
      placeholder: certo 0.1.18
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: "`CERTO_LLM_MODEL`, or the ladder with `--escalate`."
      placeholder: anthropic/claude-haiku-5-5
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and how you installed Certo
      placeholder: macOS 26, uv tool install certo
  - type: textarea
    id: command
    attributes:
      label: The command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: verdict
    attributes:
      label: The verdict line, if the run got that far
      placeholder: "Verification: retry_exhausted"
  - type: textarea
    id: output
    attributes:
      label: The relevant output
      description: The error or the lines around what went wrong. Remove keys first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
